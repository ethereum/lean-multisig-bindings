name: Compare benchmark runners

on:
  pull_request:
    paths:
      - .github/workflows/benchmark-runner-comparison.yml
      - scripts/check-benchmark-ci.sh

permissions:
  contents: read

concurrency:
  group: benchmark-runner-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  slow:
    name: Slow suite / ${{ matrix.runner_id }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_id: requested-chungus-x68
            runner: '["self-hosted-ghr","size-chungus-x68"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 180
    steps:
      - name: Check out the comparison revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17
        with:
          toolchain: 1.94.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - name: Record runner environment
        shell: bash
        run: |
          mkdir -p benchmark-artifacts/runner-comparison
          lighthouse_revision=$(
            sed -n 's/^lighthouse-bls = .*rev = "\([0-9a-f][0-9a-f]*\)".*$/\1/p' \
              benchmarks/comparison/Cargo.toml
          )
          if ! printf '%s\n' "$lighthouse_revision" | grep -Eq '^[0-9a-f]{40}$' \
            || [[ $(printf '%s\n' "$lighthouse_revision" | wc -l) -ne 1 ]]; then
            echo 'Cargo.toml must contain exactly one 40-hex Lighthouse revision' >&2
            exit 1
          fi
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_id=${{ matrix.runner_id }}"
            echo "runner_name=${{ runner.name }}"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "kernel=$(uname -srvmo)"
            echo "logical_cpus=$(nproc)"
            echo "lighthouse_revision=$lighthouse_revision"
            echo "suite=slow"
            echo "samples=3"
            echo "key_creation_slots=1048576"
            echo "same_sizes=1,8,16,256,512"
            echo "distinct_sizes=1,8,16"
            echo "mixed_claim_shapes=512x8,512x16"
            echo "proof_warmup=enabled"
            if [[ -f /sys/fs/cgroup/cpu.max ]]; then
              echo "cgroup_cpu_max=$(tr ' ' / < /sys/fs/cgroup/cpu.max)"
            fi
            if [[ -f /sys/fs/cgroup/memory.max ]]; then
              echo "cgroup_memory_max=$(< /sys/fs/cgroup/memory.max)"
            fi
            echo
            rustc -Vv
            cargo -V
            lscpu
            free -h
          } > benchmark-artifacts/runner-comparison/environment.txt

      - name: Run identical large-key and proof benchmarks
        shell: bash
        run: |
          set -o pipefail
          cargo build --release -p lean-multisig-comparison --bin slow_comparison
          /usr/bin/time -v -o benchmark-artifacts/runner-comparison/resource-usage.txt \
            target/release/slow_comparison \
            --samples 3 \
            --same-sizes 1,8,16,256,512 \
            --distinct-sizes 1,8,16 \
            --mixed-claim-counts 8,16 \
            --warmup-proofs \
            --json benchmark-artifacts/runner-comparison/full.json 2>&1 \
            | tee benchmark-artifacts/runner-comparison/slow-output.txt

      - name: Normalize comparison data
        shell: bash
        run: |
          set -o pipefail
          echo "measured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> benchmark-artifacts/runner-comparison/environment.txt
          python3 scripts/build_benchmark_dashboard.py slow \
            --input benchmark-artifacts/runner-comparison/full.json \
            --resource benchmark-artifacts/runner-comparison/resource-usage.txt \
            --environment benchmark-artifacts/runner-comparison/environment.txt \
            --output benchmark-artifacts/runner-comparison/dashboard.json \
            | tee -a benchmark-artifacts/runner-comparison/slow-output.txt

      - name: Upload runner measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-comparison-${{ matrix.runner_id }}-${{ github.run_id }}
          path: benchmark-artifacts/runner-comparison/
          if-no-files-found: warn
          retention-days: 7

      - name: Add measurement to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.runner_id }}"
            echo
            if [[ -f benchmark-artifacts/runner-comparison/environment.txt ]]; then
              echo '```text'
              sed -n '1,35p' benchmark-artifacts/runner-comparison/environment.txt
              echo '```'
            fi
            if [[ -f benchmark-artifacts/runner-comparison/slow-output.txt ]]; then
              sed -n '/^Workload | Size |/,$p' benchmark-artifacts/runner-comparison/slow-output.txt
            else
              echo 'Benchmark output was not produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
