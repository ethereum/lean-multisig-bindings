name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v7

      # rust-toolchain.toml pins the rustc version; this action honors it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Create virtualenv
        run: uv venv
        working-directory: bindings/python

      - name: Build + install (release, with dev extras)
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release --extras dev
          working-directory: bindings/python
          sccache: true

      - name: Run tests
        run: uv run --extra dev pytest tests/ -v
        working-directory: bindings/python

      - name: Check type stubs match runtime
        run: uv run --extra dev python -m mypy.stubtest py_lean_multisig --allowlist stubtest_allowlist.txt
        working-directory: bindings/python

  java:
    name: Java 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the native ABI
        run: cargo test -p lean-multisig-native --test abi

      - name: Test Java bindings
        run: gradle -p bindings/java test

  go:
    name: Go cgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.mod

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Stage static native bridge
        run: |
          sh bindings/native/scripts/stage-static.sh bindings/go/internal/native/linux_amd64
          cmp bindings/native/include/lean_multisig_native.h bindings/go/internal/native/include/lean_multisig_native.h

      - name: Test Go bindings
        run: go test ./...
        working-directory: bindings/go
