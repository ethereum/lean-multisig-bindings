name: Benchmark dashboard

on:
  push:
    branches:
      - main
    paths:
      - .cargo/**
      - .github/workflows/benchmarks-history.yml
      - benchmarks/comparison/**
      - bindings/rust/**
      - leanVM/**
      - scripts/build_benchmark_dashboard.py
      - scripts/check-benchmark-ci.sh
      - scripts/test_benchmark_dashboard.py
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        default: all
        type: choice
        options:
          - fast
          - slow
          - all
      samples:
        description: Slow-suite sample count
        required: true
        default: '3'
        type: string
      same_sizes:
        description: Comma-separated same-claim signer counts (maximum 512)
        required: true
        default: '1,8,16,256,512'
        type: string
      distinct_sizes:
        description: Comma-separated distinct-claim counts (maximum 16)
        required: true
        default: '1,8,16'
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-dashboard
  cancel-in-progress: false

jobs:
  fast:
    name: Measure fast comparison benchmarks
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'fast' || inputs.suite == 'all'))
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 30
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17
        with:
          toolchain: 1.94.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - name: Record benchmark environment
        shell: bash
        run: |
          mkdir -p benchmark-artifacts/fast
          lighthouse_revision=$(
            sed -n 's/^lighthouse-bls = .*rev = "\([0-9a-f][0-9a-f]*\)".*$/\1/p' \
              benchmarks/comparison/Cargo.toml
          )
          if ! printf '%s\n' "$lighthouse_revision" | grep -Eq '^[0-9a-f]{40}$' \
            || [[ $(printf '%s\n' "$lighthouse_revision" | wc -l) -ne 1 ]]; then
            echo 'Cargo.toml must contain exactly one 40-hex Lighthouse revision' >&2
            exit 1
          fi
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "kernel=$(uname -srvmo)"
            echo "lighthouse_revision=$lighthouse_revision"
            echo "suite=fast"
            echo "samples=criterion-default"
            echo "proof_warmup=not-applicable"
            echo
            rustc -Vv
            cargo -V
            lscpu
          } > benchmark-artifacts/fast/environment.txt

      - name: Run fast Criterion benchmarks
        shell: bash
        run: |
          set -o pipefail
          rm -rf -- target/criterion
          cargo bench -p lean-multisig-comparison --bench comparison -- \
            --noplot 2>&1 \
            | tee benchmark-artifacts/fast/criterion-output.txt

      - name: Build current fast dashboard data
        run: |
          echo "measured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> benchmark-artifacts/fast/environment.txt
          python3 scripts/build_benchmark_dashboard.py fast \
            --input benchmark-artifacts/fast/criterion-output.txt \
            --criterion-dir target/criterion \
            --environment benchmark-artifacts/fast/environment.txt \
            --output benchmark-artifacts/fast/dashboard.json
          cp benchmarks/comparison/dashboard/index.html benchmark-artifacts/fast/index.html

      - name: Collect Criterion estimates
        run: cp -R target/criterion benchmark-artifacts/fast/criterion

      - name: Upload fast dashboard measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-dashboard-fast-${{ github.run_id }}
          path: benchmark-artifacts/fast/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Add current fast results to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Current fast benchmark results'
            echo
            echo '```text'
            if [[ -f benchmark-artifacts/fast/criterion-output.txt ]]; then
              cat benchmark-artifacts/fast/criterion-output.txt
            else
              echo 'Benchmark output was not produced.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  slow:
    name: Measure large-key and proof benchmarks
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'slow' || inputs.suite == 'all'))
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 180
    env:
      BENCH_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && inputs.samples || '3' }}
      BENCH_SAME_SIZES: ${{ github.event_name == 'workflow_dispatch' && inputs.same_sizes || '1,8,16,256,512' }}
      BENCH_DISTINCT_SIZES: ${{ github.event_name == 'workflow_dispatch' && inputs.distinct_sizes || '1,8,16' }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@35d8a35b823d6c20db516f5c35eb0a9640942c17
        with:
          toolchain: 1.94.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - name: Validate manual benchmark inputs
        shell: bash
        run: |
          [[ "$BENCH_SAMPLES" =~ ^[0-9]+$ ]] && (( 10#$BENCH_SAMPLES >= 3 )) || {
            echo 'samples must be an integer greater than or equal to 3' >&2
            exit 1
          }
          [[ "$BENCH_SAME_SIZES" =~ ^[0-9]+(,[0-9]+)*$ ]] || {
            echo 'same_sizes must be a comma-separated integer list' >&2
            exit 1
          }
          [[ "$BENCH_DISTINCT_SIZES" =~ ^[0-9]+(,[0-9]+)*$ ]] || {
            echo 'distinct_sizes must be a comma-separated integer list' >&2
            exit 1
          }

      - name: Record benchmark environment
        shell: bash
        run: |
          mkdir -p benchmark-artifacts/slow
          lighthouse_revision=$(
            sed -n 's/^lighthouse-bls = .*rev = "\([0-9a-f][0-9a-f]*\)".*$/\1/p' \
              benchmarks/comparison/Cargo.toml
          )
          if ! printf '%s\n' "$lighthouse_revision" | grep -Eq '^[0-9a-f]{40}$' \
            || [[ $(printf '%s\n' "$lighthouse_revision" | wc -l) -ne 1 ]]; then
            echo 'Cargo.toml must contain exactly one 40-hex Lighthouse revision' >&2
            exit 1
          fi
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "kernel=$(uname -srvmo)"
            echo "lighthouse_revision=$lighthouse_revision"
            echo "suite=slow"
            echo "samples=$BENCH_SAMPLES"
            echo "key_creation_slots=1048576"
            echo "same_sizes=$BENCH_SAME_SIZES"
            echo "distinct_sizes=$BENCH_DISTINCT_SIZES"
            echo "proof_warmup=enabled"
            echo
            rustc -Vv
            cargo -V
            lscpu
          } > benchmark-artifacts/slow/environment.txt

      - name: Run large-key and steady-state proof benchmarks
        shell: bash
        run: |
          set -o pipefail
          cargo build --release -p lean-multisig-comparison --bin slow_comparison
          /usr/bin/time -v -o benchmark-artifacts/slow/resource-usage.txt \
            target/release/slow_comparison \
            --samples "$BENCH_SAMPLES" \
            --same-sizes "$BENCH_SAME_SIZES" \
            --distinct-sizes "$BENCH_DISTINCT_SIZES" \
            --warmup-proofs \
            --json benchmark-artifacts/slow/full.json 2>&1 \
            | tee benchmark-artifacts/slow/slow-output.txt

      - name: Build current slow dashboard data
        run: |
          set -o pipefail
          echo "measured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> benchmark-artifacts/slow/environment.txt
          python3 scripts/build_benchmark_dashboard.py slow \
            --input benchmark-artifacts/slow/full.json \
            --resource benchmark-artifacts/slow/resource-usage.txt \
            --environment benchmark-artifacts/slow/environment.txt \
            --output benchmark-artifacts/slow/dashboard.json \
            | tee -a benchmark-artifacts/slow/slow-output.txt
          cp benchmarks/comparison/dashboard/index.html benchmark-artifacts/slow/index.html

      - name: Upload slow dashboard measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-dashboard-slow-${{ github.run_id }}
          path: benchmark-artifacts/slow/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

      - name: Add current slow results to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Current slow benchmark results'
            echo
            if [[ -f benchmark-artifacts/slow/slow-output.txt ]]; then
              sed -n '/^Workload | Size |/,$p' benchmark-artifacts/slow/slow-output.txt
            else
              echo 'Benchmark output was not produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish current benchmark dashboard
    if: always() && (needs.fast.result == 'success' || needs.slow.result == 'success')
    needs: [fast, slow]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the Pages branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: gh-pages
          fetch-depth: 1
          path: site

      - name: Download fast measurement
        if: needs.fast.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: benchmark-dashboard-fast-${{ github.run_id }}
          path: publish/fast

      - name: Download slow measurement
        if: needs.slow.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: benchmark-dashboard-slow-${{ github.run_id }}
          path: publish/slow

      - name: Replace the current suite data
        shell: bash
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          SLOW_RESULT: ${{ needs.slow.result }}
        run: |
          set -euo pipefail
          mkdir -p site/data
          if [[ "$FAST_RESULT" == success ]]; then
            cp publish/fast/dashboard.json site/data/fast.json
            cp publish/fast/index.html site/index.html
          fi
          if [[ "$SLOW_RESULT" == success ]]; then
            cp publish/slow/dashboard.json site/data/slow.json
            cp publish/slow/index.html site/index.html
          fi
          touch site/.nojekyll
          if [[ -d site/dev/bench ]]; then
            rm -r -- site/dev/bench
            rmdir site/dev 2>/dev/null || true
          fi
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Current dashboard is already up to date.'
            exit 0
          fi
          git commit -m 'bench: update current benchmark dashboard'
          git push origin HEAD:gh-pages
